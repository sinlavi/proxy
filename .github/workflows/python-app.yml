name: Run Bale Crawler Bot

on:
  workflow_dispatch:   # Manual start
  push:
    branches: [ main ] # Run whenever you push code to main

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Bale Bot
        run: |
          echo "Starting bot..."
          nohup python app.py > bot.log 2>&1 &

      - name: Keep job alive
        run: |
          echo "Bot is running..."
          while true; do
            sleep 300
            echo "Still alive at $(date)"
          done
